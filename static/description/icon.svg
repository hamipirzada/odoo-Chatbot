<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c5ce7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a29bfe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00b894;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#55a3ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="aiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fd79a8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fdcb6e;stop-opacity:1" />
    </linearGradient>
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGradient)" stroke="#ffffff" stroke-width="2"/>
  
  <!-- AI Brain/Circuit pattern in top-left -->
  <g transform="translate(20, 20)">
    <!-- Central AI node -->
    <circle cx="20" cy="20" r="8" fill="url(#aiGradient)" filter="url(#glow)"/>
    
    <!-- Neural network connections -->
    <line x1="20" y1="20" x2="35" y2="15" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
    <line x1="20" y1="20" x2="35" y2="25" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
    <line x1="20" y1="20" x2="15" y2="5" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
    <line x1="20" y1="20" x2="5" y2="15" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
    
    <!-- Smaller nodes -->
    <circle cx="35" cy="15" r="4" fill="#ffffff" opacity="0.9"/>
    <circle cx="35" cy="25" r="4" fill="#ffffff" opacity="0.9"/>
    <circle cx="15" cy="5" r="4" fill="#ffffff" opacity="0.9"/>
    <circle cx="5" cy="15" r="4" fill="#ffffff" opacity="0.9"/>
  </g>
  
  <!-- Analytics Chart in bottom-right -->
  <g transform="translate(55, 55)">
    <!-- Chart background -->
    <rect x="0" y="0" width="45" height="35" fill="rgba(255,255,255,0.2)" rx="4"/>
    
    <!-- Bar chart bars -->
    <rect x="5" y="25" width="6" height="8" fill="url(#chartGradient)"/>
    <rect x="13" y="20" width="6" height="13" fill="url(#chartGradient)"/>
    <rect x="21" y="15" width="6" height="18" fill="url(#chartGradient)"/>
    <rect x="29" y="22" width="6" height="11" fill="url(#chartGradient)"/>
    <rect x="37" y="18" width="6" height="15" fill="url(#chartGradient)"/>
    
    <!-- Trend line overlay -->
    <polyline points="8,28 16,23 24,18 32,25 40,21" 
              fill="none" stroke="#fd79a8" stroke-width="2" opacity="0.8"/>
    
    <!-- Data points -->
    <circle cx="8" cy="28" r="2" fill="#fd79a8"/>
    <circle cx="16" cy="23" r="2" fill="#fd79a8"/>
    <circle cx="24" cy="18" r="2" fill="#fd79a8"/>
    <circle cx="32" cy="25" r="2" fill="#fd79a8"/>
    <circle cx="40" cy="21" r="2" fill="#fd79a8"/>
  </g>
  
  <!-- Floating data particles -->
  <g opacity="0.6">
    <circle cx="25" cy="45" r="2" fill="#ffffff">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="90" cy="35" r="2" fill="#ffffff">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="105" cy="75" r="2" fill="#ffffff">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="15" cy="95" r="2" fill="#ffffff">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Central AI text -->
  <text x="64" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" opacity="0.9">AI</text>
  
  <!-- Subtle outer glow -->
  <circle cx="64" cy="64" r="60" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
</svg>